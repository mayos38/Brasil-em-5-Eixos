<!DOCTYPE html>

<title>Brasil em 5 Eixos — Preview Integrado (DEV · M15 intermediário)</title>
<!--
  PREVIEW INTEGRADO — MÓDULO 15 INTERMEDIÁRIO (apenas para testes de interface)

  O que é: carrega a INTERFACE REAL (brasil-quiz/index.html, sem cópias) e os
  módulos reais M1–M11 na ordem correta, e executa o bootstrap provisório do M15:
    tela boot -> carga do banco real (data/questions.json via BQ5.bank.load)
    -> menu principal automaticamente.

  COMO EXECUTAR (obrigatório: servidor HTTP local):
    1) Na raiz do projeto (a pasta que contém brasil-quiz/ e dev/):
         python -m http.server 8000
    2) Abrir no navegador:
         http://localhost:8000/dev/integrated-preview.html

  Por que servidor HTTP? O banco oficial e a interface real são carregados via
  fetch(); o Chrome bloqueia fetch em file://.

  ISOLAMENTO: não altera módulos originais; não contém perguntas, regras,
  pontuação nem cronômetro próprios (motor/relógio/persistência = M5/M6 reais).
  Sem pausa (não existe no projeto) e sem M12–M14.
-->
