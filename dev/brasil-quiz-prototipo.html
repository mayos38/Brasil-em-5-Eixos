<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>Brasil em 5 Eixos — Protótipo</title>
<style>
:root{--bg:#0a1220;--card:#121c30;--card2:#182440;--txt:#eef2fb;--mut:#93a1bd;--green:#2fae6b;--yellow:#ffd23f;--red:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 800px at 70% -10%,#14224a,var(--bg));color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:18px 14px 44px}
h2,h3{margin:8px 0}
.card{background:var(--card);border:1px solid #233252;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid #2c3d66;background:var(--card2);color:var(--txt);font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;text-align:center}
.btn.primary{background:linear-gradient(135deg,#2fbf71,#1e9e5a);border:none;color:#fff}
.btn.small{width:auto;display:inline-block;padding:9px 14px;font-size:14px;margin-top:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:#1d2c4e;color:var(--yellow);font-size:12px;font-weight:700;letter-spacing:.3px;margin-right:6px}
.opt{width:100%;text-align:left;padding:12px 14px;border-radius:12px;margin-top:8px;background:var(--card2);border:1px solid #2c3d66;color:var(--txt);font-size:15.5px;cursor:pointer}
.opt:hover{border-color:var(--green)}
.opt.correct{background:#123b26;border-color:var(--green)}
.opt.wrong{background:#3b1720;border-color:var(--red)}
.opt.locked{pointer-events:none;opacity:.9}
.timerbar{height:6px;background:#22304f;border-radius:99px;margin:10px 0;overflow:hidden}
.timerbar>div{height:100%;width:100%;background:linear-gradient(90deg,var(--yellow),#ff9d3f)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:#1d2c4e;border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip.on{outline:2px solid var(--yellow)}
textarea.code,input,select{width:100%;padding:11px 12px;background:#0c1526;border:1px solid #2c3d66;border-radius:10px;color:var(--txt);font-size:15px;margin-top:8px;font-family:inherit}
textarea.code{min-height:84px;font-size:12px;word-break:break-all}
.muted{color:var(--mut);font-size:13.5px;line-height:1.5}
.expbox{background:#101b32;border-left:3px solid var(--yellow);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:14px;line-height:1.5}
.title{font-size:30px;font-weight:800;letter-spacing:.5px;text-align:center;margin:6px 0 2px;background:linear-gradient(90deg,#7ee08a,var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent}
.ok{color:#7ee08a;font-size:14.5px}.bad{color:var(--red);font-size:14.5px}
code{background:#0c1526;padding:2px 6px;border-radius:6px;font-size:13px}
.node circle{fill:#182440;stroke:#3b4f80;stroke-width:2;cursor:pointer}
.node.cur circle{stroke:var(--yellow);stroke-width:3.5;animation:pulse 1.1s infinite alternate}
.node.done circle{fill:#1d4630;stroke:var(--green)}
@keyframes pulse{from{opacity:.7}to{opacity:1}}
.nlbl{fill:#cdd8ee;font-size:12px;font-weight:700}.nscore{fill:#ffd23f;font-size:10.5px}
.exitlink{display:inline-block;margin-top:10px;color:var(--mut);font-size:13px;cursor:pointer;text-decoration:underline}
details summary{cursor:pointer}
</style>
</head>

const BASE={1:10,2:20,3:40};
const DLAB={1:'FÁCIL',2:'NORMAL',3:'DIFÍCIL'};
const THEME_L={all:'Todos os temas',cultura:'Cultura',economia:'Economia',animais:'Animais',vegetacao:'Vegetação',cidades:'Cidades'};
const REG_L={norte:'Norte',nordeste:'Nordeste','centro-oeste':'Centro-Oeste',sudeste:'Sudesto',sul:'Sul'};

let G=null; // sessão ativa
const C={mode:'solo',theme:'all',diff:'normal',count:10,target:0};
function clearAllTimers(){if(G&&G.timer){clearInterval(G.timer);G.timer=null;}}
function poolFor(theme,diff){let q=BANK.filter(x=>!theme||x.t===theme);const tiers={edu:[1],normal:[1,2],medio:[2,3],dificil:[3]};let p=q.filter(x=>tiers[diff].includes(x.d));if(p.length<5)p=q;return p;}
function inst(q){const ord=shuffle([0,1,2,3]);return{txt:q.q,o:ord.map(i=>q.o[i]),a:ord.indexOf(q.a),d:q.d,e:q.e,t:q.t,reg:q.reg};}
function buildQuiz(theme,diff,count,region){let base;if(region){const rp=shuffle(BANK.filter(x=>x.reg===region));base=rp.slice(0,count);if(base.length<count)base=base.concat(shuffle(BANK.filter(x=>x.reg!==region)).slice(0,count-base.length));}else{base=shuffle(poolFor(theme,diff)).slice(0,count);}return base.map(inst);}
function copyTxt(id){const el=$('#'+id);const t=el.value;let done=false;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>done=true).catch(()=>{});}if(!done){el.focus();el.select();try{document.execCommand('copy');}catch(e){}}}

/* ---------- MENU ---------- */
function menu(){clearAllTimers();G=null;$('#app').innerHTML=`<div class="card" style="text-align:center"><div class="title">BRASIL EM 5 EIXOS</div><div class="muted" style="margin-bottom:10px">Quiz offline • 🎭 cultura • 💰 economia • 🦜 animais • 🌿 vegetação • 🏙️ cidades<br>Protótipo v0.1 — ${BANK.length} questões no banco</div></div>
<button class="btn primary" onclick="setup('solo')">📚 Modo Solo (educativo)</button>
<button class="btn" onclick="campaignMap()">🗺️ Campanha: atravessar o Brasil</button>
<button class="btn" onclick="setup('local2')">⚔️ 1×1 no mesmo aparelho</button>
<button class="btn" onclick="setup('local4')">👥 Todos contra todos (mesmo aparelho)</button>
<button class="btn" onclick="lanSetup()">📡 Sala LAN / Wi-Fi <span class="badge">experimental</span></button>
<div class="card muted">Dica: o modo solo explica cada resposta — ótimo para revisão. O 1×1 e o FFA rodam sem internet; a sala LAN conecta vários aparelhos na mesma rede.</div>`;}

/* ---------- SETUP (solo / local) ---------- */
function setup(preset){C.mode=preset;if(!C.theme)C.theme='all';const isLocal=(preset==='local2'||preset==='local4');let html=`<div class="card"><h3>${preset==='solo'?'📚 Modo Solo':(isLocal?'⚔️ Partida no mesmo aparelho':'🎮 Configuração')}</h3>
<label class="muted">Tema</label><select id="f-theme">${Object.entries(THEME_L).map(([k,v])=>`<option value="${k}"${C.theme===k?' selected':''}>${v}</option>`).join('')}</select>
<label class="muted">Dificuldade</label><select id="f-diff"><option value="edu"${C.diff==='edu'?' selected':''}>Educativo (fácil + explicações)</option><option value="normal"${C.diff==='normal'?' selected':''}>Normal</option><option value="medio"${C.diff==='medio'?' selected':''}>Médio</option><option value="dificil"${C.diff==='dificil'?' selected':''}>Difícil</option></select>`;
if(isLocal){const n=preset==='local2'?2:4;html+=`<label class="muted">Quantos jogadores (2 a 4)</label><input id="f-pn" type="number" min="2" max="4" value="${n}">`;for(let i=0;i<4;i++)html+=`<input id="f-name${i}" placeholder="Nome do jogador ${i+1}" maxlength="14">`;
 html+=`<label class="muted">Perguntas</label><select id="f-count"><option>8</option><option selected>10</option><option>12</option></select>`;
 html+=`<label class="muted">Vence quem chegar a… (ou o de mais pontos no fim)</label><select id="f-target"><option value="0" selected>Sem meta — vence quem tiver mais</option><option value="100">100 pontos</option><option value="200">200 pontos</option></select>`;}
html+=`<div class="row"><button class="btn primary small" onclick="${isLocal?'startLocal()':'startSolo()'}">Começar ▶</button><button class="btn small" onclick="menu()">Voltar</button></div>
<p class="muted">15 segundos por pergunta. Pontos: fácil 10, normal 20, difícil 40 + bônus de tempo (até 7).</p></div>`;$('#app').innerHTML=html;}

function startSolo(){C.theme=$('#f-theme').value;C.diff=$('#f-diff').value;
const quiz=buildQuiz(C.theme==='all'?null:C.theme,C.diff,10);
G={mode:'solo',quiz,i:0,score:0,right:0,review:[],locked:false,tEnd:0,lastChoice:-1};qView();}

function startLocal(){C.theme=$('#f-theme').value;C.diff=$('#f-diff').value;
let n=parseInt($('#f-pn').value,10)||2;n=Math.max(2,Math.min(4,n));
const players=[];for(let i=0;i<n;i++){players.push(($('#f-name'+i).value.trim())||('Jogador '+(i+1)));}
C.count=parseInt($('#f-count').value,10)||10;C.target=parseInt($('#f-target').value,10)||0;
const quiz=buildQuiz(C.theme==='all'?null:C.theme,C.diff,C.count);
G={mode:'local',players,quiz,count:C.count,target:C.target,scores:{},i:-1,turn:0,review:[],locked:false,tEnd:0,lastChoice:-1};handoffView();}

/* ---------- VIEW DE PERGUNTA (solo/campanha/local) ---------- */
function scoreChips(){if(G.mode==='local'){return G.players.map((nm,i)=>`<span class="chip${i===G.turn?' on':''}">${esc(nm)} <b>${G.scores[nm]||0}</b></span>`).join('');}if(G.mode==='solo')return `<span class="chip">Pontos: <b>${G.score}</b> • Acertos: ${G.right}/${G.i+(G.locked?1:0)}</span>`;return '';}
function qLabel(){if(G.mode==='local')return 'Vez de '+esc(G.players[G.turn]);if(G.mode==='campaign')return `Campanha • ${REG_L[G.region]} (${G.i+1}/${G.quiz.length})`;return `Pergunta ${G.i+1} de ${G.quiz.length}`;}
function qView(){const qi=G.quiz[G.i];G.locked=false;clearAllTimers();
$('#app').innerHTML=`<div class="card">
<div class="row" style="justify-content:space-between"><span class="muted">${qLabel()}</span>${scoreChips()}</div>
<div class="timerbar"><div id="tb"></div></div><div style="text-align:right" class="muted"><span id="tsec">15</span>s</div>
<div class="row" style="margin-top:6px"><span class="badge">${THEME_L[qi.t]}</span><span class="badge" style="background:#243a2e;color:#8fe09f">${REG_L[qi.reg]}</span><span class="badge" style="background:#3a2d12;color:var(--yellow)">${DLAB[qi.d]}</span></div>
<h3 style="margin:12px 0 4px;line-height:1.4">${esc(qi.txt)}</h3>
${qi.o.map((o,i)=>`<button class="opt" id="op${i}" onclick="answer(${i})"><b>${'ABCD'[i]})</b> ${esc(o)}</button>`).join('')}
<span class="exitlink" onclick="if(confirm('Sair da partida?'))menu()">⏸ sair da partida</span>
</div>`;
G.tEnd=Date.now()+15000;G.timer=setInterval(tick,100);}
function tick(){const rem=Math.max(0,G.tEnd-Date.now());const tb=$('#tb');if(tb)tb.style.width=(rem/15000*100)+'%';const s=$('#tsec');if(s)s.textContent=Math.ceil(rem/1000);if(rem<=0){answer(-1);}}

function answer(i){if(!G||G.locked)return;G.locked=true;clearAllTimers();G.lastChoice=i;
const qi=G.quiz[G.i];const rem=Math.max(0,Math.round((G.tEnd-Date.now())/1000));
const ok=i===qi.a;let pts=ok?BASE[qi.d]+Math.min(rem,7):0;
ok?sGood():sBad();
if(G.mode==='solo'||G.mode==='campaign'){if(ok)G.score+=pts;if(ok)G.right++;}
G.review.push({q:qi,choice:i,p:G.mode==='local'?G.players[G.turn]:null,ok});
const btnLabel=(G.i+1>=G.quiz.length)?'Ver resultado 🏁':'Continuar ▶';
revealView(ok,pts,btnLabel,()=>{if(G.i+1>=G.quiz.length){(G.mode==='campaign')?endStage():endQuiz();}else{G.i++;qView();}});}

function revealView(ok,pts,btnLabel,next){const qi=G.quiz[G.i];
$('#app').innerHTML=`<div class="card">
<div class="row" style="justify-content:space-between"><span class="muted">${qLabel()}</span>${scoreChips()}</div>
<h3 style="margin-top:6px">${ok?'✅ Acertou!':'❌ Não foi dessa vez'} ${pts?`<b>+${pts} pts</b>`:''}</h3>
<p class="muted" style="margin-top:2px">Resposta correta: <b>${esc(qi.o[qi.a])}</b></p>
${qi.o.map((o,idx)=>{let c='opt locked';if(idx===qi.a)c+=' correct';else if(idx===G.lastChoice)c+=' wrong';return `<div class="${c}"><b>${'ABCD'[idx]})</b> ${esc(o)}</div>`;}).join('')}
<div class="expbox">💡 ${esc(qi.e)}</div>
<button class="btn primary" onclick="window.__next()">${btnLabel}</button></div>`;
window.__next=next;}

/* ---------- RESULTADOS / REVISÃO ---------- */
function endQuiz(){const total=G.quiz.length;const pct=Math.round(G.right/total*100);
const key='bq5_best_solo';const prev=LS.get(key,0);if(G.score>prev)LS.set(key,G.score);
$('#app').innerHTML=`<div class="card" style="text-align:center"><h2>Fim de jogo!</h2>
<div style="font-size:40px;font-weight:800;color:var(--yellow)">${G.score} pts</div>
<p class="muted">Acertos: ${G.right}/${total} (${pct}%) • Recorde solo: ${Math.max(prev,G.score)} pts</p></div>
<button class="btn primary" onclick="reviewScreen()">📖 Revisar as questões (educativo)</button>
<button class="btn" onclick="startSolo()">Jogar de novo</button><button class="btn" onclick="menu()">Menu</button>`;}

function endStage(){const P=prog();P.done[G.region]=true;if(G.score>(P.best[G.region]||0))P.best[G.region]=G.score;LS.set('bq5_prog',P);
const allDone=STAGES.every(r=>P.done[r]);
if(allDone){$('#app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🏆</div><h2>Você atravessou o Brasil!</h2>
<p class="muted">Todas as 5 regiões concluídas. Total de recordes: ${STAGES.reduce((s,r)=>s+(P.best[r]||0),0)} pts</p></div>
<button class="btn primary" onclick="reviewScreen()">📖 Revisar a última região</button>
<button class="btn" onclick="campaignMap()">Ver mapa</button>
<button class="btn" onclick="LS.set('bq5_prog',{done:{},best:{}});campaignMap()">Reiniciar campanha</button><button class="btn" onclick="menu()">Menu</button>`;return;}
$('#app').innerHTML=`<div class="card" style="text-align:center"><h2>${REG_L[G.region]} concluída! 🎉</h2>
<div style="font-size:36px;font-weight:800;color:var(--yellow)">${G.score} pts</div><p class="muted">Acertos: ${G.right}/${G.quiz.length}</p></div>
<button class="btn primary" onclick="reviewScreen()">📖 Revisar as questões (educativo)</button>
<button class="btn" onclick="campaignMap()">Continuar no mapa ▶</button>`;}

function reviewScreen(){let h=`<div class="card"><h3>📖 Revisão</h3><p class="muted">Revise cada pergunta e a explicação — ótimo para estudar.</p></div>`;
G.review.forEach((r,k)=>{h+=`<div class="card" style="padding:12px"><b>${k+1}.</b> ${esc(r.q.txt)}${r.p?` <span class="muted">(${esc(r.p)})</span>`:''}<br>
<span class="${r.ok?'ok':'bad'}">${r.ok?'✅ Você acertou':(r.choice<0?'⏰ Tempo esgotado':'❌ Você marcou: '+esc(r.q.o[r.choice]))} • Correta: ${esc(r.q.o[r.q.a])}</span>
<div class="expbox">💡 ${esc(r.q.e)}</div></div>`;});
h+=`<button class="btn" onclick="${G.mode==='campaign'?'campaignMap()':'menu()'}">Voltar</button>`;$('#app').innerHTML=h;}

/* ---------- CAMPANHA ---------- */
const STAGES=['norte','nordeste','centro-oeste','sudeste','sul'];
function prog(){return LS.get('bq5_prog',{done:{},best:{}});}
function campaignMap(){clearAllTimers();G=null;const P=prog();const idxNext=STAGES.findIndex(r=>!P.done[r]);
const POS={norte:[135,62],nordeste:[287,104],'centro-oeste':[187,142],sudeste:[292,206],sul:[207,258]};
let nodes='';STAGES.forEach((r,i)=>{const done=P.done[r];const cls=done?'done':(i===idxNext?'cur':'lock');const p=POS[r];
nodes+=`<g class="node ${cls}" onclick="${(i===idxNext||done)?`stageOpen('${r}')`:''}">
<circle cx="${p[0]}" cy="${p[1]}" r="16"></circle>${done?`<text x="${p[0]}" y="${p[1]+5}" text-anchor="middle">✓</text>`:''}
<text class="nlbl" x="${p[0]}" y="${p[1]-24}" text-anchor="middle">${REG_L[r]}</text>${P.best[r]!=null?`<text class="nscore" x="${p[0]}" y="${p[1]+36}" text-anchor="middle">${P.best[r]} pts</text>`:''}</g>`;});
$('#app').innerHTML=`<div class="card"><h3>🗺️ Campanha — atravesse o Brasil</h3><p class="muted">Complete 6 perguntas de cada região, do Norte ao Sul. ${Object.keys(P.done).length}/5 regiões concluídas.</p></div>
<div class="card" style="padding:8px"><svg viewBox="0 0 400 300" width="100%">
<path d="M95,28 L150,18 L210,24 L252,46 L300,78 L318,112 L308,150 L336,206 L300,252 L213,298 L150,268 L128,214 L140,168 L118,118 L92,78 Z" fill="#1b2a4d" opacity="0.5"></path>
<path d="M135,62 L287,104 L187,142 L292,206 L207,258" stroke="#ffd23f" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity=".7"></path>
${nodes}</svg></div>
<button class="btn small" onclick="menu()">← Menu</button>`;}
function stageOpen(r){const quiz=buildQuiz(null,'normal',6,r);
G={mode:'campaign',region:r,quiz,i:0,score:0,right:0,review:[],locked:false,tEnd:0,lastChoice:-1};qView();}

/* ---------- LAN (WebRTC, experimental) ---------- */
const RT={host:null,joiner:null};
function rtcOK(){return typeof RTCPeerConnection!=='undefined';}
function lanSetup(){$('#app').innerHTML=`<div class="card"><h3>📡 Sala LAN / Wi-Fi <span class="badge">experimental</span></h3>
<p class="muted">Jogue em vários aparelhos na mesma rede, sem internet e sem login. Um aparelho cria a sala (anfitrião) e os demais entram trocando códigos.</p>
${!rtcOK()?`<div class="expbox" style="border-color:var(--red)">⚠️ Este navegador não expõe WebRTC. Dica: sirva o arquivo em <b>http://localhost</b> (ex.: <code>python -m http.server</code>) e abra por esse endereço.</div>`:''}
<label class="muted">Tema da partida</label><select id="l-theme">${Object.entries(THEME_L).map(([k,v])=>`<option value="${k}"${k==='all'?' selected':''}>${v}</option>`).join('')}</select>
<label class="muted">Dificuldade</label><select id="l-diff"><option value="normal" selected>Normal</option><option value="edu">Educativo (fácil)</option><option value="medio">Médio</option><option value="dificil">Difícil</option></select>
<div class="row"><button class="btn primary small" onclick="lanGo('host')">🏠 Criar sala (anfitrião)</button><button class="btn small" onclick="lanGo('join')">🚪 Entrar em uma sala</button><button class="btn small" onclick="menu()">Voltar</button></div>
<details style="margin-top:10px"><summary class="muted">Como funciona (4 passos)</summary><p class="muted">1) Anfitrião cria a sala e copia o código 1. 2) Jogador cola o código 1 e recebe seu código 2. 3) Jogador manda o código 2 ao anfitrião, que aplica. 4) Conectados! O anfitrião inicia (máx. 4 jogadores).</p></details></div>`;}
function lanGo(role){C.theme=$('#l-theme').value;C.diff=$('#l-diff').value;
if(role==='host'){leaveRoom();lanHostEnter();}else{leaveRoom();lanJoinView();}}

/* --- anfitrião --- */
function lanStatus(t){const el=$('#lan-status');if(el)el.innerHTML=t;}
function renderLanHost(){const n=RT.host?Object.keys(RT.host.peers).length:0;
$('#app').innerHTML=`<div class="card"><h3>🏠 Anfitrião</h3><p id="lan-status" class="muted">Gerando convite…</p>
<label class="muted">Código 1 — envie ao próximo jogador</label><textarea id="lan-code1" class="code" readonly></textarea>
<button class="btn small" onclick="copyTxt('lan-code1');this.textContent='✅ Copiado!'">📋 Copiar código 1</button>
<label class="muted">Cole aqui o código que o jogador enviar (código 2)</label><input id="lan-ans-in" placeholder="cole o código do jogador…">
<div class="row"><button class="btn small primary" onclick="hostApplyAnswer()">Aplicar</button><button class="btn small" onclick="leaveRoom();menu()">Sair da sala</button></div>
<h4 style="margin-top:14px">Jogadores (${n}/4)</h4><div id="host-players"></div>
<div id="lan-match"></div>
<button class="btn primary" id="lan-start" disabled onclick="hostStartMatch()">▶ Iniciar partida</button></div>`;
if(RT.host)$('#lan-code1').value=RT.host.offer||'';renderHostPlayers();}
function renderHostPlayers(){const el=$('#host-players');if(!el)return;const ps=Object.values(RT.host.peers);
el.innerHTML=ps.length?ps.map(p=>`<span class="chip">👤 ${esc(p.name)}</span>`).join(' '):'<span class="muted">Ninguém entrou ainda.</span>';
const st=$('#lan-start');if(st)st.disabled=(ps.length<2||!!(G&&G.lan));}
async function lanHostEnter(){RT.host={peers:{},nextId:1,offer:'',pending:null};renderLanHost();
try{await genHostOffer();$('#lan-code1').value=RT.host.offer;lanStatus('Código 1 pronto. Aguardando jogadores…');}catch(e){lanStatus('⚠️ Falha ao criar a sala: '+e.message);}}
async function genHostOffer(){const pc=new RTCPeerConnection();const dc=pc.createDataChannel('g');wireHostDC(pc,dc);
const off=await pc.createOffer();await pc.setLocalDescription(off);RT.host.pending=pc;RT.host.offer=btoa(JSON.stringify(pc.localDescription));}
function findPeer(dc){for(const k in RT.host.peers)if(RT.host.peers[k].dc===dc)return RT.host.peers[k];return null;}
function wireHostDC(pc,dc){
dc.onopen=()=>lanStatus('Canal aberto. Aguardando o jogador se apresentar…');
dc.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(err){return;}const rec=findPeer(dc);
 if(m.t==='ice'){pc.addIceCandidate(m.c).catch(()=>{});}
 else if(m.t==='hello'&&!rec){if(Object.keys(RT.host.peers).length>=4){lanStatus('⚠️ Sala cheia (máx. 4).');return;}const id='p'+(RT.host.nextId++);RT.host.peers[id]={id,pc,dc,name:m.name||('Jogador '+id)};onPeerJoined(RT.host.peers[id]);}
 else if(rec&&G&&G.lan&&m.t==='ans'){hostMsgAns(rec.id,m.choice);}};
dc.onclose=()=>{const rec=findPeer(dc);if(rec){delete RT.host.peers[rec.id];renderHostPlayers();lanStatus('⚠️ Um jogador saiu da sala.');}};}
function onPeerJoined(rec){try{rec.dc.send(JSON.stringify({t:'you',id:rec.id}));}catch(e){}
renderHostPlayers();const n=Object.keys(RT.host.peers).length;
lanStatus(`✅ ${esc(rec.name)} entrou! (${n}/4)`);
if(n<4&&!(G&&G.lan))genHostOffer().then(()=>{const el=$('#lan-code1');if(el)el.value=RT.host.offer;});}
async function hostApplyAnswer(){try{const txt=$('#lan-ans-in').value.trim();if(!txt){lanStatus('Cole o código do jogador primeiro.');return;}await RT.host.pending.setRemoteDescription(JSON.parse(atob(txt)));$('#lan-ans-in').value='';lanStatus('Código aplicado. Aguardando o jogador se conectar…');}catch(e){lanStatus('⚠️ Código inválido — confira se copiou tudo.');}}
function broadcast(m){Object.values(RT.host.peers).forEach(p=>{try{if(p.dc.readyState==='open')p.dc.send(JSON.stringify(m));}catch(e){}});}
function hostTickUI(t){const el=$('#lan-match-status');if(el)el.textContent=t;}
function renderHostLive(){const el=$('#lan-live');if(!el)return;
el.innerHTML=G.players.map(p=>`<span class="chip">${esc(p.name)} <b>${G.scores[p.id]||0}</b></span>`).join(' ');}
function hostStartMatch(){const plist=Object.values(RT.host.peers);if(plist.length<2||(G&&G.lan))return;
const quiz=buildQuiz(C.theme==='all'?null:C.diff?C.theme:null,C.diff,8);
G={mode:'lan',role:'host',lan:true,players:plist.map(p=>({id:p.id,name:p.name})),quiz,i:-1,scores:{},target:C.target,locked:false,tEnd:0};
broadcast({t:'start',players:G.players,count:quiz.length,target:G.target});
$('#lan-match').innerHTML=`<div class="card" style="padding:12px;margin-top:12px"><b>Partida em andamento</b><br><span id="lan-match-status" class="muted">…</span><div id="lan-live" style="margin-top:8px"></div></div>`;
sendQ(0);}
function sendQ(i){const qi=G.quiz[i];G.i=i;G.cur=qi;G.lanAns={};G.locked=false;clearAllTimers();
broadcast({t:'q',i,qd:{txt:qi.txt,o:qi.o}});
hostTickUI(`Pergunta ${i+1} de ${G.quiz.length} — aguardando respostas (0/${G.players.length})`);renderHostLive();
G.tEnd=Date.now()+15000;G.timer=setInterval(()=>{const rem=Math.max(0,G.tEnd-Date.now());if(rem<=0)lanRevealHost();},200);}
function hostMsgAns(pid,choice){if(!G||!G.lan||G.locked)return;G.lanAns[pid]=choice;
hostTickUI(`Pergunta ${G.i+1} — respostas: ${Object.keys(G.lanAns).length}/${G.players.length}`);
if(Object.keys(G.lanAns).length>=G.players.length)lanRevealHost();}
function lanRevealHost(){if(!G||!G.lan||G.locked)return;G.locked=true;clearAllTimers();const qi=G.cur;
const rem=Math.max(0,Math.round((G.tEnd-Date.now())/1000));
const pts={};G.players.forEach(p=>{const c=G.lanAns[p.id];pts[p.id]=(c===qi.a)?BASE[qi.d]+Math.min(rem,7):0;G.scores[p.id]=(G.scores[p.id]||0)+pts[p.id];});
broadcast({t:'reveal',a:qi.a,e:qi.e,pts,scores:G.scores});renderHostLive();hostTickUI('Respostas reveladas…');
setTimeout(()=>{const done=G.i+1>=G.quiz.length||(G.target>0&&Math.max(...Object.values(G.scores))>=G.target);
 if(done){broadcast({t:'end',final:Object.entries(G.scores).map(([id,s])=>({name:G.players.find(p=>p.id===id).name,score:s}))});renderHostEnd();}
 else sendQ(G.i+1);},3500);}
function renderHostEnd(){const el=$('#lan-match');if(!el)return;
el.innerHTML=`<div class="card" style="padding:12px;margin-top:12px"><b>🏁 Fim da partida</b><br>${Object.entries(G.scores).sort((a,b)=>b[1]-a[1]).map(([id,s],i)=>`<div>${i===0?'🥇 ':''}${esc(G.players.find(p=>p.id===id).name)} — <b>${s} pts</b></div>`).join('')}<br><button class="btn small primary" onclick="leaveRoom();menu()">Sair da sala</button></div>`;}

/* --- jogador (convidado) --- */
function lanJoinView(){$('#app').innerHTML=`<div class="card"><h3>🚪 Entrar em uma sala</h3><p id="lan-status" class="muted">Cole o código 1 do anfitrião.</p>
<label class="muted">Seu nome</label><input id="lan-name" placeholder="Jogador" maxlength="14">
<label class="muted">Código 1 (do anfitrião)</label><textarea id="lan-code-in" class="code"></textarea>
<button class="btn primary small" onclick="joinEnter()">Gerar meu código ▶</button>
<div id="join-part2" style="display:none"><label class="muted">Código 2 — envie ao anfitrião</label><textarea id="lan-code2" class="code" readonly></textarea><button class="btn small" onclick="copyTxt('lan-code2');this.textContent='✅ Copiado!'">📋 Copiar código 2</button></div>
<button class="btn small" style="margin-top:10px" onclick="leaveRoom();menu()">Sair</button></div>`;}
async function joinEnter(){if(!rtcOK()){lanStatus('⚠️ WebRTC indisponível neste navegador.');return;}
let offer;try{offer=JSON.parse(atob($('#lan-code-in').value.trim()));}catch(e){lanStatus('⚠️ Código inválido — confira se copiou tudo.');return;}
const pc=new RTCPeerConnection();RT.joiner={pc,dc:null};
pc.ondatachannel=e=>{RT.joiner.dc=e.channel;wireJoinerDC(e.channel);};
pc.onicecandidate=e=>{if(e.candidate&&RT.joiner.dc&&RT.joiner.dc.readyState==='open')try{RT.joiner.dc.send(JSON.stringify({t:'ice',c:e.candidate}));}catch(err){}};
await pc.setRemoteDescription(offer);
const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
$('#join-part2').style.display='block';
$('#lan-code2').value=btoa(JSON.stringify(pc.localDescription));
lanStatus('Código 2 pronto — envie ao anfitrião. Aguardando conexão…');}
function wireJoinerDC(dc){
dc.onopen=()=>{try{const nm=$('#lan-name')?$('#lan-name').value.trim()||'Jogador':'Jogador';dc.send(JSON.stringify({t:'hello',name:nm}));}catch(e){}};
dc.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(err){return;}joinMsg(m);};
dc.onclose=()=>{$('#app').innerHTML=`<div class="card"><h3>📡 Fim da conexão</h3><p class="muted">O anfitrião saiu ou a rede caiu.</p><button class="btn" onclick="leaveRoom();menu()">Menu</button></div>`;};}
function joinMsg(m){const J=RT.joiner;if(!J)return;
if(m.t==='ice'){J.pc.addIceCandidate(m.c).catch(()=>{});}
else if(m.t==='you'){G={mode:'lan',role:'joiner',myId:m.id,scores:{},locked:true,cur:null,i:-1};
 $('#app').innerHTML=`<div class="card" style="text-align:center"><h2>Conectado! 🎉</h2><p class="muted">Aguardando o anfitrião iniciar a partida…</p></div>`;}
else if(m.t==='start'){G.players=m.players;G.count=m.count;G.target=m.target;G.i=-1;G.scores={};
 $('#app').innerHTML=`<div class="card" style="text-align:center"><h2>Partida iniciada</h2><p class="muted">Jogadores: ${m.players.map(p=>esc(p.name)).join(', ')} • ${m.count} perguntas${m.target?' • meta '+m.target+' pts':''}</p></div>`;}
else if(m.t==='q'){clientQ(m);}
else if(m.t==='reveal'){clientReveal(m);}
else if(m.t==='end'){clientEnd(m.final);}}
function clientQ(m){G.cur=m.qd;G.i=m.i;G.locked=false;clearAllTimers();
$('#app').innerHTML=`<div class="card">
<div class="row" style="justify-content:space-between"><span class="muted">Pergunta ${m.i+1} de ${G.count}</span><span class="chip">Você: <b>${(G.scores[G.myId]||0)} pts</b></span></div>
<div class="timerbar"><div id="tb"></div></div>
<h3 style="line-height:1.4;margin-top:8px">${esc(m.qd.txt)}</h3>
${m.qd.o.map((o,i)=>`<button class="opt" id="op${i}" onclick="clientAnswer(${i})"><b>${'ABCD'[i]})</b> ${esc(o)}</button>`).join('')}</div>`;
G.tEnd=Date.now()+15000;G.timer=setInterval(()=>{const rem=Math.max(0,G.tEnd-Date.now());const tb=$('#tb');if(tb)tb.style.width=(rem/15000*100)+'%';if(rem<=0)clientAnswer(-1);},200);}
function clientAnswer(i){if(!G||G.locked)return;G.locked=true;clearAllTimers();
try{RT.joiner.dc.send(JSON.stringify({t:'ans',i:G.i,choice:i}));}catch(e){}
document.querySelectorAll('.opt').forEach(b=>b.classList.add('locked'));
const sel=$('#op'+Math.max(0,i));if(sel&&i>=0)sel.classList.add(G.cur.a===i?'correct':'wrong');
$('#app').insertAdjacentHTML('beforeend','<div class="expbox" style="margin-top:10px">⏳ Respondido! Aguardando os outros jogadores…</div>');}
function clientReveal(m){G.scores=m.scores;const myP=m.pts[G.myId]||0;myP?sGood():sBad();
const q=G.cur;
$('#app').innerHTML=`<div class="card"><h3>${myP?`✅ +${myP} pts`:'❌ Sem pontos'}</h3>
<p class="muted">Resposta correta: <b>${esc(q.o[m.a])}</b></p>
${q.o.map((o,i)=>{let c='opt locked';if(i===m.a)c+=' correct';return `<div class="${c}"><b>${'ABCD'[i]})</b> ${esc(o)}</div>`;}).join('')}
<div class="expbox">💡 ${esc(q.e)}</div>
<div class="row" style="margin-top:10px">${G.players.map(p=>`<span class="chip">${esc(p.name)} <b>${m.scores[p.id]||0}</b></span>`).join('')}</div>
<p class="muted" style="text-align:center;margin-top:8px">Próxima pergunta em instantes…</p></div>`;}
function clientEnd(final){$('#app').innerHTML=`<div class="card" style="text-align:center"><h2>🏁 Fim da partida!</h2>${final.sort((a,b)=>b.score-a.score).map((f,i)=>`<div style="font-size:16px;margin-top:4px">${i===0?'🥇 ':''}${esc(f.name)} — <b>${f.score} pts</b></div>`).join('')}</div>
<button class="btn primary" onclick="leaveRoom();menu()">Sair da sala</button>`;}

function leaveRoom(){clearAllTimers();
if(RT.host){Object.values(RT.host.peers).forEach(p=>{try{p.dc.close();}catch(e){}try{p.pc.close();}catch(e){}});RT.host=null;}
if(RT.joiner){try{RT.joiner.dc&&RT.joiner.dc.close();}catch(e){}try{RT.joiner.pc.close();}catch(e){}RT.joiner=null;}
G=null;}

menu();
</script>
</body>
</html>
